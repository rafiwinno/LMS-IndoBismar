    .tab-btn { padding: 8px 16px; border: 2px solid #dce3ed; border-bottom: none;
               border-radius: 8px 8px 0 0; background: #f5f7fa; cursor: pointer;
               font-size: 13px; color: #555; font-family: Arial; }

    .tab-panel { display: none; background: #fff; border: 2px solid #1a3c6e;
                 border-radius: 0 8px 8px 8px; padding: 20px; box-shadow: 0 2px 8px #0001; overflow-x: auto; }
    .tab-panel.active { display: block; }
    .panel-title { font-size: 14px; font-weight: bold; color: #1a3c6e;
                   margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #bbdefb; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
